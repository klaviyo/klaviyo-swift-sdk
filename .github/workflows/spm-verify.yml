name: SPM Release Verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify (e.g. 5.5.0)
        required: true
        type: string
      slack_thread_ts:
        description: Slack message ts to reply under. Set by publish-release.yml; leave empty to post a new message
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: spm-verify-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

env:
  SLACK_USERNAME: Swift SDK
  SLACK_ICON_EMOJI: ':merlin-orb-swift:'

jobs:
  verify:
    name: Resolve and build tag via SPM
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_URL: ${{ github.event.release.html_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, inputs.tag) }}
    steps:
      - name: Record job start
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            scripts/spm-verify.sh
            scripts/check-ci-green.sh
            scripts/check-version.sh
          sparse-checkout-cone-mode: false

      - name: Notify Slack - verifying
        id: slack_pending
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: pending
          title: Swift SDK `${{ env.TAG }}` SPM verify running
          body: Checking the version, CI and SPM resolve and build at `${{ env.TAG }}`.
          fields: |
            Version: `${{ env.TAG }}`
            Commit: `${{ env.SHORT_SHA }}`
            Trigger: ${{ github.event_name == 'release' && 'Automatic (GitHub Release)' || 'Manual (Workflow Dispatch)' }}
          links: |
            Release|${{ env.RELEASE_URL }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Check out version files at ${{ env.TAG }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: tag-src
          persist-credentials: false
          sparse-checkout: |
            Sources/KlaviyoCore/Utils/Version.swift
            /*.podspec
          sparse-checkout-cone-mode: false

      - name: Check ${{ env.TAG }} matches version in code
        id: version_check
        uses: ./.github/actions/check-release-version
        with:
          version: ${{ env.TAG }}
          path: tag-src
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ inputs.slack_thread_ts || steps.slack_pending.outputs.ts }}
          consequence: SPM consumers resolve this tag directly, so they already see it, and the SDK reports the Version.swift version at runtime. Skipped SPM verification, the Linear release sync and the iOS test app bump. Fix the release and tag so the tag name matches Version.swift.

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Check iOS SDK CI passed on ${{ env.TAG }}
        id: ci_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/check-ci-green.sh "$TAG"

      - name: Notify Slack - gates passed
        id: slack_stage
        if: steps.ci_check.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ steps.slack_pending.outputs.ts }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: pending
          title: Swift SDK `${{ env.TAG }}` SPM verify running, gates passed
          body: Version and CI checks passed. Resolving and building `${{ env.TAG }}` through SPM.
          fields: |
            Version: `${{ env.TAG }}`
            Commit: `${{ env.SHORT_SHA }}`
          links: |
            Release|${{ env.RELEASE_URL }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Resolve and build ${{ env.TAG }}
        id: build
        if: (success() || failure()) && steps.version_check.outcome != 'failure'
        run: ./scripts/spm-verify.sh "$TAG" "$RUNNER_TEMP/spm-verify"

      - name: Dispatch SDK bump to iOS test app
        id: test_app_dispatch
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TEST_APP_DISPATCH_TOKEN }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "Prerelease tag $TAG, skipping test app bump."
            exit 0
          fi
          gh api repos/klaviyo/klaviyo-ios-test-app/dispatches \
            -f event_type=sdk-released \
            -F client_payload[version]="$TAG"

      - name: Classify cancellation
        id: stop
        if: cancelled()
        env:
          TIMEOUT_MINUTES: 30
        run: |
          elapsed=$(( $(date +%s) - ${JOB_START:-$(date +%s)} ))
          if [ "$elapsed" -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find failed step
        id: failed
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          jq -r '
            {
              version_check: ["Version check", true],
              ci_check: ["iOS SDK CI check", true],
              build: ["SPM resolve and build", false]
            } as $names
            | ([to_entries[] | select(.value.conclusion == "failure" and ($names[.key] != null))][0].key) as $key
            | if $key == null then "name=unknown step\ngate=false" else "name=\($names[$key][0])\ngate=\($names[$key][1])" end
          ' <<<"$STEPS_JSON" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: success() || failure() || (cancelled() && steps.stop.outputs.timed_out == 'true')
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ steps.slack_stage.outputs.ts || steps.slack_pending.outputs.ts }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: ${{ steps.test_app_dispatch.outcome == 'failure' && 'warning' || (job.status == 'success' && 'success' || (job.status == 'cancelled' && 'stopped' || 'failure')) }}
          title: Swift SDK `${{ env.TAG }}` SPM verify ${{ job.status == 'success' && 'passed' || (job.status == 'cancelled' && 'timed out' || (steps.failed.outputs.gate == 'true' && format('blocked, {0} failed', steps.failed.outputs.name) || 'failed')) }}${{ steps.test_app_dispatch.outcome == 'failure' && ', test app bump failed' || '' }}
          body: CI check, SPM resolve and build at `${{ env.TAG }}`.${{ steps.test_app_dispatch.outcome == 'failure' && ' The iOS test app SDK bump dispatch failed. Bump `klaviyo-ios-test-app` by hand or re-run this job.' || '' }}
          fields: |
            Version: `${{ env.TAG }}`
            Commit: `${{ env.SHORT_SHA }}`
            Author: ${{ github.actor }}
          links: |
            Release|${{ env.RELEASE_URL }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Checkout full history for Linear sync
        id: linear-checkout
        if: success() && !contains(env.TAG, '-') && github.event.release.prerelease != true
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync release to Linear
        id: linear-sync
        if: success() && !contains(env.TAG, '-') && github.event.release.prerelease != true && steps.linear-checkout.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ env.TAG }}
          name: ${{ env.TAG }}

      - name: Complete release in Linear
        if: success() && !contains(env.TAG, '-') && github.event.release.prerelease != true && steps.linear-sync.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ env.TAG }}
