# Publishes an SDK release behind a `release` environment approval.
#
# prepare: branch, tag, version and CI checks, then finds or creates a draft GitHub release.
# publish: after approval, publishes the draft (creating the tag) and dispatches the downstream
#          workflows at the tag. Releases published with GITHUB_TOKEN don't fire `release: published`
#          or tag-push triggers, so downstream workflows are started with workflow_dispatch.
# stopped: posts to Slack when the approval is rejected or the run is cancelled (skipped on dry_run).
#
# Usage: gh workflow run publish-release.yml -f version=X.Y.Z[-suffix] [-f ref=<branch-or-sha>]
#        [-f dry_run=true] [-f skip_ci_check=true]
# A version with a suffix (e.g. 5.6.0-beta.1) is published as a prerelease and never marked latest.
# dry_run runs every check and waits for approval, but creates no draft, release or tag.

name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z or X.Y.Z-suffix for a prerelease)
        required: true
        type: string
      ref:
        description: Branch (master or rel/*) or commit to release (defaults to the default branch)
        required: false
        type: string
      dry_run:
        description: 'Dry run: run every check and the approval; create no draft, release or tag'
        required: false
        default: false
        type: boolean
      skip_ci_check:
        description: Skip the iOS SDK CI check (branch, tag and version checks still run)
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions: {}

env:
  GH_REPO: ${{ github.repository }}
  VERSION: ${{ inputs.version }}
  PRERELEASE: ${{ contains(inputs.version, '-') }}
  DRY_RUN: ${{ inputs.dry_run }}
  SKIP_CI_CHECK: ${{ inputs.skip_ci_check }}
  SLACK_USERNAME: Swift SDK
  SLACK_ICON_EMOJI: ':merlin-orb-swift:'

jobs:
  prepare:
    name: Prepare release draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
      draft_url: ${{ steps.draft.outputs.url }}
      slack_ts: ${{ steps.slack_pending.outputs.ts }}
    steps:
      - name: Validate version format
        id: version-format
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-suffix, got '$VERSION'"
            exit 1
          fi

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve commit
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a commit on master or rel/*
        id: branch-check
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/rel/*:refs/remotes/origin/rel/*'
          if [ -z "$(git branch -r --contains HEAD --list 'origin/master' 'origin/rel/*')" ]; then
            echo "::error::$(git rev-parse HEAD) is not on master or a rel/* branch"
            exit 1
          fi

      - name: Check tag does not exist
        id: tag-check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - name: Check version in code
        id: version-check
        run: ./scripts/check-version.sh "$VERSION"

      - name: Check iOS SDK CI passed on commit
        id: ci-check
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-ci-green.sh "${{ steps.commit.outputs.sha }}"

      - name: Warn that the CI check was skipped
        id: skip-ci
        if: inputs.skip_ci_check
        run: echo "::warning::iOS SDK CI check skipped by request; CI on this commit was not verified"

      - name: Find or create draft release
        id: draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          create=true
          if existing=$(gh release view "$VERSION" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"' 2>/dev/null); then
            read -r is_draft target <<< "$existing"
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $VERSION is already published"
              exit 1
            fi
            if [ "$target" = "$SHA" ]; then
              echo "Reusing existing draft for $VERSION; notes left as-is"
              create=false
            else
              echo "::warning::existing draft for $VERSION targets $target, not $SHA; recreating it with fresh notes"
              gh release delete "$VERSION" --yes
            fi
          fi
          if [ "$create" = "true" ]; then
            gh release create "$VERSION" --draft --generate-notes --title "$VERSION" --target "$SHA" \
              --prerelease="$PRERELEASE"
          fi
          url=$(gh release view "$VERSION" --json url --jq .url)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Write summary
        id: summary
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          DRAFT_URL: ${{ steps.draft.outputs.url }}
        run: |
          suffix=""
          if [ "$DRY_RUN" = "true" ]; then suffix=" (dry run)"; fi
          {
            echo "### Release $VERSION awaiting approval$suffix"
            echo "- Commit: \`$SHA\`"
            if [ -n "$DRAFT_URL" ]; then
              echo "- Draft: $DRAFT_URL"
              echo "Review and edit the draft notes, then approve the \`publish\` job."
            else
              echo "Dry run: no draft created. Approving \`publish\` creates nothing."
            fi
            if [ "$SKIP_CI_CHECK" = "true" ]; then
              echo "- ⚠️ **iOS SDK CI check skipped:** CI on this commit was not verified"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Slack action
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack - awaiting approval
        id: slack_pending
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: pending
          title: Swift SDK `${{ inputs.version }}` ${{ env.PRERELEASE == 'true' && 'prerelease' || 'release' }} awaiting approval${{ inputs.skip_ci_check && ' (iOS SDK CI check skipped)' || '' }}
          body: Review the draft release notes, then approve the `publish` job on this run.
          fields: |
            Version: `${{ inputs.version }}`
            Commit: `${{ steps.commit.outputs.short_sha }}`
            Requested by: ${{ github.actor }}
          links: |
            Draft release|${{ steps.draft.outputs.url }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}

      - name: Find failed step
        id: failed
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          step=$(jq -r '
            {
              "version-format": "Validate version format",
              checkout: "Checkout repository",
              commit: "Resolve commit",
              "branch-check": "Require a commit on master or rel/*",
              "tag-check": "Check tag does not exist",
              "version-check": "Check version in code",
              "ci-check": "Check iOS SDK CI passed on commit",
              "skip-ci": "Warn that the CI check was skipped",
              draft: "Find or create draft release",
              summary: "Write summary",
              "dry-run": "Dry run - stop before publishing",
              "publish-release": "Publish draft and create tag",
              dispatch: "Dispatch downstream workflows at tag"
            } as $names
            | ([to_entries[] | select(.value.conclusion == "failure")][0].key) as $key
            | if $key == null then "unknown step" else ($names[$key] // $key) end
          ' <<<"$STEPS_JSON")
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - failure
        id: slack_failure
        if: failure()
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ steps.slack_pending.outputs.ts }}
          status: failure
          title: Swift SDK `${{ inputs.version }}` release failed
          fields: |
            Version: `${{ inputs.version }}`
            Commit: `${{ steps.commit.outputs.short_sha }}`
            Stage: Prepare release draft
          links: Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}

      - name: Reply with failure details
        if: failure() && steps.slack_failure.outputs.ts != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ steps.slack_failure.outputs.ts }}
          status: failure
          title: Failed at ${{ steps.failed.outputs.step }}

  publish:
    name: Publish release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: write
    outputs:
      started: ${{ steps.started.outputs.started }}
    env:
      SLACK_TS: ${{ needs.prepare.outputs.slack_ts }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
    steps:
      - name: Mark job started
        id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Dry run - stop before publishing
        id: dry-run
        if: inputs.dry_run
        run: |
          echo "Dry run: all checks passed and approval granted; no release, tag or dispatch created"
          echo "### Dry run for $VERSION passed; nothing published" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish draft and create tag
        id: publish-release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$VERSION" --draft=false --target "$SHA" --prerelease --latest=false
          else
            latest=true
            current=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
              echo "$VERSION is older than the current latest release $current; not marking it latest"
              latest=false
            fi
            gh release edit "$VERSION" --draft=false --target "$SHA" --prerelease=false --latest="$latest"
          fi

      - name: Dispatch downstream workflows at tag
        id: dispatch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          thread_ts="$SLACK_TS"
          # True when the workflow file at $VERSION declares slack_thread_ts.
          takes_thread_ts() {
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/$1?ref=$VERSION" \
              -H "Accept: application/vnd.github.raw" | grep -q '^[[:space:]]*slack_thread_ts:'
          }
          dispatch() {
            workflow="$1"
            shift
            if [ -n "$thread_ts" ] && takes_thread_ts "$workflow"; then
              gh workflow run "$workflow" --ref "$VERSION" -f slack_thread_ts="$thread_ts" "$@"
            else
              gh workflow run "$workflow" --ref "$VERSION" "$@"
            fi
          }
          failed=0
          dispatch spm-verify.yml -f tag="$VERSION" || failed=1
          dispatch cocoapods-publish.yml -f version="$VERSION" || failed=1
          {
            echo "### Released $VERSION"
            echo "- Release: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$VERSION"
            echo "- Dispatched at \`$VERSION\`: spm-verify.yml, cocoapods-publish.yml"
            echo "- Runs: $GITHUB_SERVER_URL/$GH_REPO/actions"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Dispatch next release branch
        if: ${{ !inputs.dry_run && env.PRERELEASE != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run rel-branch.yml --repo "$GITHUB_REPOSITORY" --ref master -f "base=$VERSION"; then
            echo "Dispatched rel-branch.yml from $VERSION"
            echo "- Dispatched rel-branch.yml with base \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not dispatch rel-branch.yml; the weekday schedule will pick it up"
          fi

      - name: Checkout Slack action
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack - success
        if: ${{ success() && !inputs.dry_run }}
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ env.SLACK_TS }}
          status: success
          title: Swift SDK `${{ inputs.version }}` published${{ env.PRERELEASE == 'true' && ' (prerelease)' || '' }}
          body: SPM verify and CocoaPods publish dispatched at the tag. They reply in this thread with their results.
          fields: |
            Version: `${{ inputs.version }}`
            Commit: `${{ env.SHORT_SHA }}`
          links: |
            Release|${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}

      - name: Find failed step
        id: failed
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          step=$(jq -r '
            {
              "version-format": "Validate version format",
              checkout: "Checkout repository",
              commit: "Resolve commit",
              "branch-check": "Require a commit on master or rel/*",
              "tag-check": "Check tag does not exist",
              "version-check": "Check version in code",
              "ci-check": "Check iOS SDK CI passed on commit",
              "skip-ci": "Warn that the CI check was skipped",
              draft: "Find or create draft release",
              summary: "Write summary",
              "dry-run": "Dry run - stop before publishing",
              "publish-release": "Publish draft and create tag",
              dispatch: "Dispatch downstream workflows at tag"
            } as $names
            | ([to_entries[] | select(.value.conclusion == "failure")][0].key) as $key
            | if $key == null then "unknown step" else ($names[$key] // $key) end
          ' <<<"$STEPS_JSON")
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - failure
        id: slack_failure
        if: failure()
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ env.SLACK_TS }}
          status: failure
          title: Swift SDK `${{ inputs.version }}` release failed
          fields: |
            Version: `${{ inputs.version }}`
            Commit: `${{ env.SHORT_SHA }}`
            Stage: Publish
          links: Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}

      - name: Reply with failure details
        if: failure() && steps.slack_failure.outputs.ts != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ steps.slack_failure.outputs.ts }}
          status: failure
          title: Failed at ${{ steps.failed.outputs.step }}

  # Rejected approvals and cancelled runs skip every failure() Slack step.
  stopped:
    name: Notify Slack if stopped
    needs: [prepare, publish]
    if: always() && !inputs.dry_run && (contains(needs.*.result, 'cancelled') || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Classify stop
        id: reason
        env:
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          PUBLISH_STARTED: ${{ needs.publish.outputs.started }}
        run: |
          if [ "$CANCELLED" = "true" ]; then
            echo "reason=cancelled" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH_STARTED" != "true" ]; then
            # A rejected approval fails the publish job before any step runs.
            echo "reason=release approval rejected" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Slack action
        if: steps.reason.outputs.reason != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack - stopped
        if: steps.reason.outputs.reason != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ needs.prepare.outputs.slack_ts }}
          status: stopped
          title: Swift SDK `${{ inputs.version }}` release stopped, ${{ steps.reason.outputs.reason }}
          body: Nothing more will publish from this run.
          fields: |
            Version: `${{ inputs.version }}`
            Commit: `${{ needs.prepare.outputs.short_sha }}`
          links: Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}
