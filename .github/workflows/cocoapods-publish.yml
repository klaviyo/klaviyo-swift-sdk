# Automatically publish to CocoaPods when a GitHub release is published
#
# This workflow publishes all five podspecs in dependency order:
# 1. KlaviyoCore (foundation, no dependencies)
# 2. KlaviyoSwiftExtension (standalone, no dependencies)
# 3. KlaviyoSwift (depends on KlaviyoCore)
# 4. KlaviyoForms (depends on KlaviyoSwift)
# 5. KlaviyoLocation (depends on KlaviyoSwift)

name: Publish to CocoaPods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 5.1.1)'
        required: true
        type: string

jobs:
  publish:
    name: Publish Podspecs to CocoaPods Trunk
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Validate podspecs
        run: |
          echo "Validating all podspecs in dependency order..."
          pod lib lint KlaviyoCore.podspec --allow-warnings
          pod lib lint KlaviyoSwiftExtension.podspec --allow-warnings
          pod lib lint KlaviyoSwift.podspec --allow-warnings --include-podspecs='*.podspec'
          pod lib lint KlaviyoForms.podspec --allow-warnings --include-podspecs='*.podspec'
          pod lib lint KlaviyoLocation.podspec --allow-warnings --include-podspecs='*.podspec'
          echo "✅ All podspecs are valid"

      - name: Publish to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -e  # Exit immediately if any command fails

          # Succeeds when trunk lists the version for the pod.
          on_trunk() {
            curl -fsS "https://trunk.cocoapods.org/api/v1/pods/$1" 2>/dev/null \
              | jq -e --arg v "$VERSION" 'any(.versions[]; .name == $v)' > /dev/null
          }

          # Succeeds when the CDN that `pod` resolves dependencies from serves the version's podspec.
          on_cdn() {
            local hash
            hash=$(printf '%s' "$1" | md5 -q)
            curl -fsSL -o /dev/null 2>/dev/null \
              "https://cdn.cocoapods.org/Specs/${hash:0:1}/${hash:1:1}/${hash:2:1}/$1/$VERSION/$1.podspec.json"
          }

          wait_for_pod_availability() {
            local pod_name=$1
            local max_attempts=30
            local attempt
            echo "⏳ Waiting for $pod_name $VERSION on the CocoaPods CDN..."
            for attempt in $(seq 1 $max_attempts); do
              if on_cdn "$pod_name"; then
                echo "  ✅ $pod_name $VERSION is available"
                return 0
              fi
              echo "  Attempt $attempt/$max_attempts: not available yet, waiting 1 minute..."
              sleep 60
            done
            echo "  ❌ Timeout: $pod_name $VERSION not available after $max_attempts minutes"
            return 1
          }

          # Extract version from release tag or input and strip 'v' prefix if present
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          VERSION="${VERSION#v}"  # Remove leading 'v' if present
          echo "Publishing podspecs version $VERSION to CocoaPods trunk..."

          # Publishes a podspec unless trunk already lists the version, so re-runs resume after a
          # partial failure. Trunk can report a push as failed after creating the version, so each
          # failed push is followed by a trunk check before retrying.
          publish_pod() {
            local podspec=$1
            local pod_name=$2
            local max_attempts=5
            local attempt wait
            if on_trunk "$pod_name"; then
              echo "⏭️  $pod_name $VERSION already published, skipping"
              return 0
            fi
            echo "📦 Publishing $pod_name..."
            for attempt in $(seq 1 $max_attempts); do
              if pod trunk push "$podspec" --allow-warnings; then
                return 0
              fi
              if on_trunk "$pod_name"; then
                echo "✅ $pod_name $VERSION is on trunk despite the push error"
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                wait=$((60 * 2 ** (attempt - 1)))
                echo "⚠️  Push of $pod_name failed (attempt $attempt/$max_attempts), retrying in ${wait}s"
                sleep "$wait"
              fi
            done
            echo "❌ Push of $pod_name failed after $max_attempts attempts"
            return 1
          }

          pause_between_pods() {
            echo "⏸️  Waiting 5 minutes before the next pod..."
            sleep 300
          }

          # Publish in dependency order, waiting for the CDN before pushing dependents
          publish_pod KlaviyoCore.podspec KlaviyoCore
          wait_for_pod_availability KlaviyoCore
          pause_between_pods

          publish_pod KlaviyoSwiftExtension.podspec KlaviyoSwiftExtension
          pause_between_pods

          publish_pod KlaviyoSwift.podspec KlaviyoSwift
          wait_for_pod_availability KlaviyoSwift
          pause_between_pods

          publish_pod KlaviyoForms.podspec KlaviyoForms
          pause_between_pods

          publish_pod KlaviyoLocation.podspec KlaviyoLocation

          echo "✅ All podspecs published successfully"

      - name: Send Slack notification on success
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ CocoaPods Release Published"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "✅ *CocoaPods Release Published*"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Version:* `${{ github.event.release.tag_name || github.event.inputs.version }}`\n*Repository:* ${{ github.repository }}\n*Trigger:* ${{ github.event_name == 'release' && 'Automatic (GitHub Release)' || 'Manual (Workflow Dispatch)' }}\n*Published Podspecs:*\n• KlaviyoCore\n• KlaviyoSwiftExtension\n• KlaviyoSwift\n• KlaviyoForms\n• KlaviyoLocation"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ github.event.release.html_url && format('*Release:* <{0}|View Release>\n', github.event.release.html_url) || '' }}*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"

      - name: Send Slack notification on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ CocoaPods Release Failed"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "❌ *CocoaPods Release Failed*"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Version:* `${{ github.event.release.tag_name || github.event.inputs.version }}`\n*Repository:* ${{ github.repository }}\n*Error:* Failed to publish one or more podspecs to CocoaPods trunk"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
