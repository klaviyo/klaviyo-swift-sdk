# Builds the DocC site and fails on any DocC warning, so broken symbol links and undocumented
# parameters are caught in review. Warnings show as annotations on the PR diff.
#
# Not a required check yet: the API still has DocC warnings until the doc-comment pass lands. Once
# master builds clean, add the "Build DocC (strict)" check to the Master ruleset. It has no path
# filter on purpose, because a required check that a path filter skips never reports and blocks
# the PR.

name: Docs

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docc:
    name: Build DocC (strict)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Build DocC and fail on warnings
        run: make docs DOCC_STRICT=1
